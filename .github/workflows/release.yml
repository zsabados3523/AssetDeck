name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Exposto no nivel do job para o `if` do passo de assinatura (macOS)
      # conseguir testar se o secret existe; sem ele, o passo e pulado.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: ubuntu
            archive_name: AssetDeck-ubuntu.tar.gz
          - os: windows-latest
            os_name: windows
            archive_name: AssetDeck-windows.zip
          - os: macos-latest
            os_name: macos
            archive_name: AssetDeck-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux system dependencies for Qt offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/assetdeck.spec

      - name: Verify build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/assetdeck/assetdeck --help

      - name: Smoke test do executavel
        timeout-minutes: 2
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          ASSETDECK_CONFIG_DIR: ${{ runner.temp }}/config
          ASSETDECK_DATA_DIR: ${{ runner.temp }}/data
          ASSETDECK_CACHE_DIR: ${{ runner.temp }}/cache
        run: |
          case "${{ runner.os }}" in
            Linux)
              BIN="dist/assetdeck/assetdeck"
              ;;
            Windows)
              BIN="dist/assetdeck/assetdeck.exe"
              ;;
            macOS)
              BIN="dist/AssetDeck.app/Contents/MacOS/assetdeck"
              ;;
            *)
              echo "SO desconhecido: ${{ runner.os }}"
              exit 1
              ;;
          esac

          SCREENSHOT="${{ runner.temp }}/screenshot.png"
          rm -f "$SCREENSHOT"

          "$BIN" --screenshot "$SCREENSHOT"

          if [ ! -s "$SCREENSHOT" ]; then
            echo "Smoke test falhou: screenshot não foi gerado ou está vazio ($SCREENSHOT)"
            exit 1
          fi

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf AssetDeck-ubuntu.tar.gz -C dist assetdeck

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/assetdeck -DestinationPath AssetDeck-windows.zip

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/AssetDeck.app
          codesign --verify --deep --strict dist/AssetDeck.app
          ditto -c -k --keepParent dist/AssetDeck.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/AssetDeck.app

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf dist/assetdeck
          ditto -c -k --keepParent dist/AssetDeck.app AssetDeck-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/AssetDeck-ubuntu.tar.gz
            release-artifacts/AssetDeck-windows.zip
            release-artifacts/AssetDeck-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
