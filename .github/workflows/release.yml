name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: ubuntu
            archive_name: AssetDeck-ubuntu.tar.gz
          - os: windows-latest
            os_name: windows
            archive_name: AssetDeck-windows.zip
          - os: macos-latest
            os_name: macos
            archive_name: AssetDeck-macos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux system dependencies for Qt offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/assetdeck.spec

      - name: Verify build (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/assetdeck/assetdeck --help

      - name: Smoke test do executavel
        timeout-minutes: 2
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          ASSETDECK_CONFIG_DIR: ${{ runner.temp }}/config
          ASSETDECK_DATA_DIR: ${{ runner.temp }}/data
          ASSETDECK_CACHE_DIR: ${{ runner.temp }}/cache
        run: |
          case "${{ runner.os }}" in
            Linux)
              BIN="dist/assetdeck/assetdeck"
              ;;
            Windows)
              BIN="dist/assetdeck/assetdeck.exe"
              ;;
            macOS)
              BIN="dist/AssetDeck.app/Contents/MacOS/assetdeck"
              ;;
            *)
              echo "SO desconhecido: ${{ runner.os }}"
              exit 1
              ;;
          esac

          SCREENSHOT="${{ runner.temp }}/screenshot.png"
          rm -f "$SCREENSHOT"

          "$BIN" --screenshot "$SCREENSHOT"

          if [ ! -s "$SCREENSHOT" ]; then
            echo "Smoke test falhou: screenshot não foi gerado ou está vazio ($SCREENSHOT)"
            exit 1
          fi

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czf AssetDeck-ubuntu.tar.gz -C dist assetdeck

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/assetdeck -DestinationPath AssetDeck-windows.zip

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf dist/assetdeck
          ditto -c -k --keepParent dist/AssetDeck.app AssetDeck-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/AssetDeck-ubuntu.tar.gz
            release-artifacts/AssetDeck-windows.zip
            release-artifacts/AssetDeck-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
